name: Render history video

on:
  push:
    branches:
      - tmp/history-video-render
    paths:
      - tools/render_history_video.py
      - .github/workflows/render-history-video.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/render_history_video.py
      - .github/workflows/render-history-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4

      - name: Install FFmpeg and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts requests

      - name: Download footage, narrate and render
        run: |
          mkdir -p out
          set +e
          python tools/render_history_video.py > out/render.log 2>&1
          status=$?
          cat out/render.log
          echo "$status" > out/render-exit-code.txt
          exit 0

      - name: Show output metadata
        if: always()
        run: |
          ls -lh out || true
          for f in out/*.mp4; do
            [ -e "$f" ] || continue
            ffprobe -v error -show_streams -show_format -of json "$f" || true
          done

      - name: Upload render result and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiang-yu-history-video
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
